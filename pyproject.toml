[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
archs = [ "x86_64", "aarch64" ]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*t-*"

[tool.cibuildwheel.environment]
LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64"
# The source-built libraries below install under /usr/local; Alpine's pkgconf
# does not search there by default, so both platforms are told explicitly.
PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/local/share/pkgconfig"
PATH = "$HOME/.cargo/bin:$PATH"

[tool.cibuildwheel.linux]
# PIXELFLUX_ENABLE_GPL selects the wheel flavour (see setup.py): it has to reach
# the container for both before-all (whether libx264 is built) and the build.
environment-pass = ["PIXELFLUX_ENABLE_GPL"]
before-all = """
    set -euxo pipefail

    # A transient clone failure fails the whole wheel build, so every source is
    # both retried and mirrored: the upstream host is tried first and a GitHub
    # copy of the same ref after it, because an outage that outlasts the retries
    # is what actually breaks these builds and it rarely covers both hosts. The
    # backoff widens to about two and a half minutes per host, which rides out a
    # blip without stalling a run behind a host that is simply gone.
    clone_source() {
        ref="$1"; dir="$2"; shift 2
        for url in "$@"; do
            for attempt in 1 2 3 4; do
                rm -rf "${dir}"
                git clone --branch "${ref}" --depth 1 "${url}" "${dir}" && return 0
                echo "clone_source: ${url} failed (attempt ${attempt}/4)" >&2
                sleep $((attempt * 15))
            done
            echo "clone_source: giving up on ${url}" >&2
        done
        return 1
    }

    # The same two native builds on both platforms, so a wheel carries the same
    # native code whichever libc it targets:
    #
    # * libx264, only for the GPL wheel (the default; PIXELFLUX_ENABLE_GPL=0
    #   builds without it and OpenH264, vendored by its crate, is the software
    #   H.264 encoder instead). No distro package is used on either platform:
    #   manylinux has none, and the wheel flavour must decide whether the
    #   library exists at all.
    # * FFmpeg n8.1, plain LGPL (no --enable-gpl/--enable-version3/
    #   --enable-libx264: only avcodec/avfilter/avutil are consumed, for
    #   h264_vaapi). Alpine's ffmpeg-dev is a GPL build (--enable-gpl
    #   --enable-libx264 ...), which auditwheel would bundle into every
    #   musllinux wheel, the non-GPL one included; building from source is what
    #   keeps the non-GPL wheel free of GPL native code.
    # libjpeg-turbo is NOT built: turbojpeg-sys vendors + statically links its
    # own copy by default (cmake + nasm are what it needs).
    case "$(printf %s "${PIXELFLUX_ENABLE_GPL:-1}" | tr 'A-Z' 'a-z')" in
        0|false|no|off) gpl=0 ;;
        *) gpl=1 ;;
    esac

    build_x264() {
        (cd /tmp && \
            clone_source stable x264 https://code.videolan.org/videolan/x264.git https://github.com/mirror/x264.git && \
            cd x264 && \
            ./configure --prefix=/usr/local --enable-shared --disable-cli && \
            make -j$(nproc) && \
            make install)
    }

    build_ffmpeg() {
        (cd /tmp && \
            clone_source n8.1 ffmpeg https://git.ffmpeg.org/ffmpeg.git https://github.com/FFmpeg/FFmpeg.git && \
            cd ffmpeg && \
            ./configure \
                --prefix=/usr/local \
                --enable-shared \
                --disable-static \
                --disable-programs \
                --disable-doc && \
            make -j$(nproc) && \
            make install)
    }

    # --- MANYLINUX (RPM-based) ---
    if command -v dnf; then
        dnf localinstall -y --nogpgcheck https://download1.rpmfusion.org/free/el/rpmfusion-free-release-$(rpm -E %rhel).noarch.rpm && \
        dnf localinstall -y --nogpgcheck https://download1.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-$(rpm -E %rhel).noarch.rpm && \
        dnf localinstall -y --nogpgcheck https://dl.fedoraproject.org/pub/epel/epel-release-latest-$(rpm -E %rhel).noarch.rpm && \
        dnf install -y \
            curl \
            clang \
            pixman-devel \
            libX11-devel \
            libXext-devel \
            libva-devel \
            libdrm-devel \
            libinput-devel \
            libxkbcommon-devel \
            mesa-libgbm-devel \
            wayland-devel \
            systemd-devel \
            git \
            make \
            gcc \
            nasm \
            cmake \
            gcc-c++ && \
        \
        curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 3 --retry-connrefused https://sh.rustup.rs | sh -s -- -y --profile minimal && \
        \
        if [ "${gpl}" = 1 ]; then build_x264; fi && \
        build_ffmpeg && \
        \
        ldconfig

    # --- ALPINE (APK-based) ---
    # libjpeg-turbo is NOT a system dep: turbojpeg-sys builds its vendored copy
    # (needs cmake + nasm). x264 and FFmpeg come from the source builds above;
    # musl's loader searches /usr/local/lib on its own, so there is no ldconfig.
    elif command -v apk; then
        apk add --no-cache \
            build-base \
            clang \
            cmake \
            nasm \
            git \
            pixman-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libva-dev \
            libdrm-dev \
            libinput-dev \
            libxkbcommon-dev \
            mesa-dev \
            wayland-dev \
            eudev-dev \
            musl-dev && \
        \
        # bindgen opens libclang at runtime, and Alpine names that package after
        # the compiler's major version, which moves every release: take the one
        # belonging to the clang just installed.
        apk add --no-cache "clang$(clang -dumpversion | cut -d. -f1)-libclang" && \
        \
        curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 3 --retry-connrefused https://sh.rustup.rs | sh -s -- -y --profile minimal && \
        \
        if [ "${gpl}" = 1 ]; then build_x264; fi && \
        build_ffmpeg
    else
        echo "Unsupported package manager"
        exit 1
    fi
"""

repair-wheel-command = """
    auditwheel repair -w {dest_dir} {wheel} \
    --exclude libva.so.2 \
    --exclude libva-drm.so.2 \
    --exclude libva-x11.so.2 \
    --exclude libdrm.so.2 \
    --exclude libgbm.so.1 \
    --exclude libEGL.so.1 \
    --exclude libgobject-2.0.so.0 \
    --exclude libglib-2.0.so.0 \
    --exclude libgmodule-2.0.so.0 \
    --exclude libffi.so.6 \
    --exclude libffi.so.7 \
    --exclude libffi.so.8 \
    --exclude libxkbcommon.so.0 \
    --exclude libpixman-1.so.0 \
    --exclude liblzma.so.5 \
    --exclude libz.so.1 \
    --exclude libstdc++.so.6 \
    --exclude libgcc_s.so.1 \
    --exclude libX11.so.6 \
    --exclude libXext.so.6 \
    --exclude libXfixes.so.3 \
    --exclude libxcb.so.1 \
    --exclude libxcb-dri3.so.0 \
    --exclude libxcb-shm.so.0 \
    --exclude libxcb-render.so.0
"""
