name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential pkg-config nasm clang libclang-dev \
            libx264-dev \
            libudev-dev libva-dev libdrm-dev libgbm-dev \
            libwayland-dev libxkbcommon-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev

      - name: Install FFmpeg 8.1
        run: |
          curl -L -o /tmp/miniforge.sh \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
          source "$HOME/miniforge3/etc/profile.d/conda.sh"
          conda create -y -n pixelflux-docs -c conda-forge "ffmpeg=8.1"
          conda activate pixelflux-docs
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build docs
        run: cargo doc --no-deps
        working-directory: pixelflux

      - name: Prepare site
        # rustdoc writes the crate under its own directory and leaves a build
        # lock behind; the site root redirects into it and the lock is dropped.
        run: |
          rm -f pixelflux/target/doc/.lock
          cat > pixelflux/target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <meta http-equiv="refresh" content="0; url=pixelflux/index.html">
          <a href="pixelflux/index.html">Redirecting...</a>
          EOF

      - name: Upload rustdoc artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: pixelflux/target/doc
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages resolves the artifact through the Actions API
      actions: read
      pages: write
      id-token: write
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
