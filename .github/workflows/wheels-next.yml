name: Wheels (next)

# Candidate wheel build, run by the Wheel bench workflow only.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      jobs:
        description: Jobs per platform
        type: number
        default: 1
      image:
        description: cache keeps each platform's image across runs; run builds it every run
        type: string
        default: cache
      abi3:
        description: Limited-API floor (e.g. cp311), empty for none
        type: string
        default: ''
      salt:
        type: string
        default: ''

permissions:
  contents: read

env:
  CIBUILDWHEEL_VERSION: 4.2.1
  IMAGE: pixelflux-wheel-deps

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Plan the images and the wheels
        id: plan
        env:
          GH_TOKEN: ${{ inputs.image == 'cache' && github.token || '' }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          JOBS: ${{ inputs.jobs }}
          ABI3: ${{ inputs.abi3 }}
          SALT: ${{ inputs.salt }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/cibuildwheel"
          "${RUNNER_TEMP}/cibuildwheel/bin/pip" install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
          "${RUNNER_TEMP}/cibuildwheel/bin/python" scripts/wheel-plan-next.py matrix "${IMAGE}" "${JOBS}" "${ABI3}" "${SALT}" | tee -a "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    name: image (${{ matrix.image.platform }})
    runs-on: ${{ matrix.image.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Build the image
        env:
          BASE: ${{ matrix.image.base }}
          PLATFORM: ${{ matrix.image.platform }}
        run: |
          python3 scripts/wheel-plan-next.py recipe > "${RUNNER_TEMP}/recipe.sh"
          # The sources and build trees the recipe leaves are not part of the image
          docker run --name deps --env PIXELFLUX_ENABLE_GPL --workdir /tmp \
            --volume "${RUNNER_TEMP}/recipe.sh:/recipe.sh:ro" "${BASE}" \
            bash -c 'bash /recipe.sh && rm -rf /tmp/* /root/.cache && { ! command -v dnf || dnf clean all; }'
          docker commit deps "${IMAGE}:${PLATFORM}"
          docker save "${IMAGE}:${PLATFORM}" | zstd -T0 > "${RUNNER_TEMP}/image.tar.zst"
          ls -l "${RUNNER_TEMP}/image.tar.zst"

      - if: inputs.image == 'run'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image.platform }}
          path: ${{ runner.temp }}/image.tar.zst
          retention-days: 1
          compression-level: 0

      - if: inputs.image == 'cache'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/image.tar.zst
          key: ${{ matrix.image.key }}

  build:
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: ${{ matrix.group.name }}
    runs-on: ${{ matrix.group.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Build the limited-API wheel from its floor up
        if: inputs.abi3 != ''
        env:
          ABI3: ${{ inputs.abi3 }}
        run: |
          python3 - <<'EOF'
          import os
          s = open("setup.py").read()
          floor = os.environ["ABI3"]
          s = s.replace("\nsetup(\n", f"\nimport sys as _s\nsetup(\n    options={{'bdist_wheel': {{'py_limited_api': '{floor}'}}}} if _s.version_info >= (3, {floor[3:]}) else {{}},\n", 1)
          open("setup.py", "w").write(s)
          EOF
          grep -n py_limited_api setup.py

      - if: inputs.image == 'run'
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.group.platform }}
          path: ${{ runner.temp }}

      - if: inputs.image == 'cache'
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/image.tar.zst
          key: ${{ matrix.group.key }}

      - name: Load the image
        # Without it the wheels are built the plain way, before-all and all
        if: inputs.image == 'run' || steps.cache.outputs.cache-hit == 'true'
        env:
          PLATFORM: ${{ matrix.group.platform }}
        run: |
          zstd -dc "${RUNNER_TEMP}/image.tar.zst" | docker load
          {
            echo "CIBW_BEFORE_ALL="
            for name in MANYLINUX_X86_64 MANYLINUX_AARCH64 MUSLLINUX_X86_64 MUSLLINUX_AARCH64; do
              echo "CIBW_${name}_IMAGE=${IMAGE}:${PLATFORM}"
            done
          } >> "$GITHUB_ENV"

      - name: Build the wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.group.build }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.group.name }}
          path: wheelhouse/*.whl
          retention-days: 1
          compression-level: 0

  purge:
    needs: build
    if: inputs.image == 'run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("image-")) | .id' \
            | while read -r id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done
