name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify release notes exist
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ ! -f "release-notes/${TAG}.md" ]; then
            echo "::error::release-notes/${TAG}.md not found"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      # One job per interpreter rather than one per (arch, libc) building the
      # whole cp39-cp314 ladder in sequence: the ladder is what set the wall
      # clock, and the interpreters share nothing but the container image.
      matrix:
        python: [cp39, cp310, cp311, cp312, cp313, cp314]
        target:
          - arch: x86_64
            runner: ubuntu-latest
            platform: manylinux
          - arch: x86_64
            runner: ubuntu-latest
            platform: musllinux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: musllinux
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the wheel (${{ matrix.python }}-${{ matrix.target.platform }}_${{ matrix.target.arch }})
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.target.platform }}_${{ matrix.target.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target.arch }}-${{ matrix.target.platform }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: levelling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Get release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          {
            echo "content<<EOF"
            cat "release-notes/${TAG}.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Classify the tag
        id: kind
        run: |
          # A pre-release tag must not take the "Latest release" badge
          case "${GITHUB_REF#refs/tags/}" in
            *[ab]*|*rc*|*dev*) echo "prerelease=true" ;;
            *) echo "prerelease=false" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.content }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          files: wheelhouse/*.whl
