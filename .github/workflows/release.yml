name: Release

# A tag push releases that tag. A manual run releases the tag it names and can
# hold the release off the "Latest" badge, for a fix to an older series.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. 2.1.0)
        type: string
        required: true
      latest:
        description: Designate this release as the latest
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The tag this run releases: the pushed one, or the one a manual run names
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify release notes exist
        run: |
          if [ ! -f "release-notes/${RELEASE_TAG}.md" ]; then
            echo "::error::release-notes/${RELEASE_TAG}.md not found"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      # One job per (arch, libc): an extra interpreter rebuilds only the PyO3
      # layer and the extension, so splitting them would duplicate before-all
      # for far less than it costs.
      matrix:
        platform: [manylinux, musllinux]
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Build wheels (${{ matrix.platform }}_${{ matrix.target.arch }})
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # Every interpreter cibuildwheel offers, floored by python_requires.
          CIBW_BUILD: "*-${{ matrix.platform }}_${{ matrix.target.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target.arch }}-${{ matrix.platform }}
          path: wheelhouse/*.whl
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: levelling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Get release notes
        id: notes
        run: |
          {
            echo "content<<EOF"
            cat "release-notes/${RELEASE_TAG}.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Classify the tag
        id: kind
        env:
          LATEST: ${{ inputs.latest }}
        run: |
          # A pre-release tag never takes the "Latest release" badge; a release
          # takes it unless a manual run holds it back
          latest=true
          if [ "${LATEST}" = "false" ]; then latest=false; fi
          case "${RELEASE_TAG}" in
            *[ab]*|*rc*|*dev*) prerelease=true; latest=false ;;
            *) prerelease=false ;;
          esac
          {
            echo "prerelease=${prerelease}"
            echo "make_latest=${latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.content }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.kind.outputs.make_latest }}
          files: wheelhouse/*.whl
