name: Wheels

# The wheel build the release workflows share, in two stages. An image per
# platform (libc and architecture) is built first: cibuildwheel's own base image
# with the before-all of pyproject.toml run in it, so the native libraries are
# compiled once per platform. Every wheel is then its own job on that image, so
# a run takes as long as an image and its slowest wheel rather than as long as a
# platform's every interpreter in turn. Nothing is kept between runs: the images
# are artifacts of the run that built them and are deleted once its wheels are
# built, which the calling job grants with `actions: write`; a run that fails
# keeps them for a day, so its failed jobs can be run again. The wheels are left
# as `wheels-*` artifacts of the calling run.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and version the wheels as; the calling run's commit is built as it stands when empty
        type: string
        default: ''

permissions:
  contents: read

env:
  # The release of the action the build job pins, which plans what it builds
  CIBUILDWHEEL_VERSION: 4.2.1
  IMAGE: pixelflux-wheel-deps

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      wheels: ${{ steps.plan.outputs.wheels }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Plan the images and the wheels
        id: plan
        run: |
          python3 -m venv "${RUNNER_TEMP}/cibuildwheel"
          "${RUNNER_TEMP}/cibuildwheel/bin/pip" install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
          "${RUNNER_TEMP}/cibuildwheel/bin/python" scripts/wheel-plan.py matrix | tee -a "$GITHUB_OUTPUT"

  image:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    name: image (${{ matrix.image.platform }})
    runs-on: ${{ matrix.image.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Build the image
        env:
          BASE: ${{ matrix.image.base }}
          PLATFORM: ${{ matrix.image.platform }}
        run: |
          python3 scripts/wheel-plan.py recipe > "${RUNNER_TEMP}/recipe.sh"
          docker run --name deps --env PIXELFLUX_ENABLE_GPL --workdir /tmp \
            --volume "${RUNNER_TEMP}/recipe.sh:/recipe.sh:ro" "${BASE}" bash /recipe.sh
          docker commit deps "${IMAGE}:${PLATFORM}"
          docker save "${IMAGE}:${PLATFORM}" | zstd -T0 > image.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image.platform }}
          path: image.tar.zst
          retention-days: 1
          compression-level: 0

  build:
    needs: [plan, image]
    strategy:
      fail-fast: false
      matrix:
        wheel: ${{ fromJSON(needs.plan.outputs.wheels) }}
    name: ${{ matrix.wheel.only }}
    runs-on: ${{ matrix.wheel.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Version the crate as the tag
        # The wheel takes its version from the crate, whose manifest spells a
        # pre-release the semver way; the lock names the crate's own version
        # too, and the build runs --locked.
        if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          crate="$(echo "${RELEASE_TAG}" | sed -E 's/rc([0-9]+)$/-rc.\1/; s/a([0-9]+)$/-alpha.\1/; s/b([0-9]+)$/-beta.\1/; s/\.post([0-9]+)$/-post.\1/; s/\.dev([0-9]+)$/-dev.\1/')"
          sed -i "0,/^version = /s|^version = .*|version = \"${crate}\"|" pixelflux/Cargo.toml
          sed -i "/^name = \"pixelflux\"$/{n;s|^version = .*|version = \"${crate}\"|}" pixelflux/Cargo.lock
          grep -q "^version = \"${crate}\"$" pixelflux/Cargo.toml
          grep -A1 "^name = \"pixelflux\"$" pixelflux/Cargo.lock | grep -q "^version = \"${crate}\"$"

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.wheel.platform }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: zstd -dc "${RUNNER_TEMP}/image.tar.zst" | docker load

      - name: Build the wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          only: ${{ matrix.wheel.only }}
        env:
          # The loaded image has run before-all already
          CIBW_BEFORE_ALL: ""
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ env.IMAGE }}:${{ matrix.wheel.platform }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ env.IMAGE }}:${{ matrix.wheel.platform }}
          CIBW_MUSLLINUX_X86_64_IMAGE: ${{ env.IMAGE }}:${{ matrix.wheel.platform }}
          CIBW_MUSLLINUX_AARCH64_IMAGE: ${{ env.IMAGE }}:${{ matrix.wheel.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.wheel.only }}
          path: wheelhouse/*.whl
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: leveling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0

  purge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("image-")) | .id' \
            | while read -r id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done
