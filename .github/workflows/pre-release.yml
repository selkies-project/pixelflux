name: Pre-Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The wheels cibuildwheel builds here, every interpreter it offers floored by
  # python_requires, each with the runner of its arch.
  plan:
    runs-on: ubuntu-latest
    outputs:
      wheels: ${{ steps.plan.outputs.wheels }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        # The cibuildwheel the build step's action runs.
        run: |
          for arch in x86_64 aarch64; do
            pipx run --spec cibuildwheel==4.2.1 cibuildwheel --print-build-identifiers --platform linux --archs "$arch"
          done | python3 -c 'import json, sys; runners = {"x86_64": "ubuntu-latest", "aarch64": "ubuntu-24.04-arm"}; print("wheels=" + json.dumps([{"id": i, "runner": runners[i.split("linux_", 1)[1]]} for i in sys.stdin.read().split()]))' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      # One job per wheel: in one job the interpreters build one after another,
      # and that ladder, not each job's before-all, set the wall clock.
      matrix:
        wheel: ${{ fromJSON(needs.plan.outputs.wheels) }}
    runs-on: ${{ matrix.wheel.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the wheel (${{ matrix.wheel.id }})
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.wheel.id }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.wheel.id }}
          path: wheelhouse/*.whl
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: leveling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          # A new tag is created at this commit rather than at the default branch's head by the
          # time the wheels have built.
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          files: wheelhouse/*.whl
