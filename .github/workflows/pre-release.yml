name: Pre-Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # One job per interpreter rather than one per (arch, libc) building the
      # whole cp39-cp314 ladder in sequence: the ladder is what set the wall
      # clock, and the interpreters share nothing but the container image.
      matrix:
        python: [cp39, cp310, cp311, cp312, cp313, cp314]
        target:
          - arch: x86_64
            runner: ubuntu-latest
            platform: manylinux
          - arch: x86_64
            runner: ubuntu-latest
            platform: musllinux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: musllinux
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the wheel (${{ matrix.python }}-${{ matrix.target.platform }}_${{ matrix.target.arch }})
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.target.platform }}_${{ matrix.target.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target.arch }}-${{ matrix.target.platform }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: levelling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          files: wheelhouse/*.whl
