name: Tests

# The crate's own tests, on both architectures the wheels ship for. Nothing else
# in CI compiles the tree -- CodeQL extracts without a build and the license gate
# resolves the crate graph only -- so this is where a build error surfaces, and
# the aarch64 job is the only one that compiles the Tegra encoder at all, that
# module being gated to it.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo test (${{ matrix.target.arch }})
    strategy:
      # One architecture's failure is the other's information, and the Tegra
      # path only exists on one of them.
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Native libraries
        # The distro's development packages, which is what a test build needs;
        # the source-built FFmpeg of the wheels is a release concern, not one
        # the tests share.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake nasm libclang-dev python3-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libx264-dev libgbm-dev libdrm-dev libwayland-dev \
            libinput-dev libudev-dev libxkbcommon-dev libpixman-1-dev libva-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: cargo test
        # Tests needing a GPU, a render node, or an encoder device mark themselves
        # ignored, which is what a runner carrying none of them runs.
        run: cargo test --manifest-path pixelflux/Cargo.toml
